name: Integration

on:
  push:
  pull_request:

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e 'python/fluxfast[dev]'
      - run: pytest -q python/fluxfast/tests/test_integration.py
      - run: PYTHONPATH=python/fluxfast/src:. python benchmarks/scripts/benchmark_cross_page.py
      - run: PYTHONPATH=python/fluxfast/src:. python benchmarks/scripts/benchmark_deferred.py --samples 1

  browser:
    name: Same-origin browser flow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@10.15.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install -e 'python/fluxfast[dev]'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir tests/browser/frontend exec playwright install --with-deps chromium
      - name: Initialize and render a packed consumer
        env:
          FLUXFAST_E2E_PYTHON: python
          FLUXFAST_RUN_LIVE: "1"
        run: pnpm test:consumer:init
      - run: pnpm test:e2e
        env:
          FLUXFAST_E2E_PYTHON: python
