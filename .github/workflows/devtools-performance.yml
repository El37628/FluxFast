name: DevTools performance

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  production-gates:
    name: Inactive runtime, bundle, and memory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v1.0.1
          path: .devtools-performance-baseline
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@10.15.0
      - name: Install candidate and stable dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir .devtools-performance-baseline install --frozen-lockfile
      - name: Build candidate and stable runtime packages
        run: |
          pnpm --filter @fluxfast/core run build
          pnpm --filter @fluxfast/next run build
          pnpm --filter @fluxfast/devtools run build
          pnpm --dir .devtools-performance-baseline --filter @fluxfast/core run build
      - name: Compare inactive runtime with v1.0.1
        run: >-
          node benchmarks/scripts/compare_devtools_inactive.mjs
          --baseline .devtools-performance-baseline
      - name: Stress active DevTools memory bounds
        run: pnpm benchmark:devtools:memory
      - name: Verify production bundle exclusion
        run: pnpm benchmark:devtools:bundle
