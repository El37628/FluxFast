name: Release artifacts

on:
  push:
  pull_request:

jobs:
  javascript-consumer:
    name: Next.js ${{ matrix.next-version }} on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 22
            next-version: 16.3.0
          - node-version: 24
            next-version: 16.3.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - run: npm install --global pnpm@10.15.0
      - name: Validate synchronized package versions
        run: |
          version="$(node -p 'require("./package.json").version')"
          node scripts/check-release-version.mjs "v${version}"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack npm artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/fluxfast-release/artifacts"
          npm pack ./packages/core --pack-destination "$RUNNER_TEMP/fluxfast-release/artifacts"
          npm pack ./packages/next --pack-destination "$RUNNER_TEMP/fluxfast-release/artifacts"
      - name: Install artifacts in an isolated consumer
        run: |
          mkdir -p "$RUNNER_TEMP/fluxfast-release/javascript"
          cp -R tests/release-consumer/javascript/. "$RUNNER_TEMP/fluxfast-release/javascript"
          npm pkg set \
            "dependencies.next=${{ matrix.next-version }}" \
            --prefix "$RUNNER_TEMP/fluxfast-release/javascript"
          npm install --prefix "$RUNNER_TEMP/fluxfast-release/javascript" --package-lock=false
          npm install --prefix "$RUNNER_TEMP/fluxfast-release/javascript" --package-lock=false --no-save \
            "$RUNNER_TEMP"/fluxfast-release/artifacts/fluxfast-core-*.tgz \
            "$RUNNER_TEMP"/fluxfast-release/artifacts/fluxfast-next-*.tgz
      - name: Verify npm artifacts
        working-directory: ${{ runner.temp }}/fluxfast-release/javascript
        run: |
          npm run generate
          npm run typecheck
          npm run smoke
      - name: Initialize and build a clean Next.js consumer
        env:
          FLUXFAST_ARTIFACT_DIR: ${{ runner.temp }}/fluxfast-release/artifacts
          FLUXFAST_NEXT_VERSION: ${{ matrix.next-version }}
        run: pnpm test:consumer:init

  python-consumer:
    name: Python wheel consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - name: Build Python artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/fluxfast-release/artifacts"
          python -m build --outdir "$RUNNER_TEMP/fluxfast-release/artifacts" python/fluxfast
      - name: Install wheel in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/fluxfast-release/venv"
          "$RUNNER_TEMP/fluxfast-release/venv/bin/python" -m pip install \
            "$RUNNER_TEMP"/fluxfast-release/artifacts/fluxfast-*.whl
      - name: Verify Python artifact
        run: |
          "$RUNNER_TEMP/fluxfast-release/venv/bin/python" tests/release-consumer/python/smoke.py
          "$RUNNER_TEMP/fluxfast-release/venv/bin/fluxfast" --help

  clean-live-consumer:
    name: Clean live consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: npm install --global pnpm@10.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build release artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/fluxfast-clean-live/artifacts"
          python -m pip install build
          python -m build --outdir "$RUNNER_TEMP/fluxfast-clean-live/artifacts" python/fluxfast
          npm pack ./packages/core --pack-destination "$RUNNER_TEMP/fluxfast-clean-live/artifacts"
          npm pack ./packages/next --pack-destination "$RUNNER_TEMP/fluxfast-clean-live/artifacts"
      - name: Install Chromium
        run: pnpm --dir tests/browser/frontend exec playwright install --with-deps chromium
      - name: Verify typed generation and two-client live synchronization from packed artifacts
        env:
          FLUXFAST_ARTIFACT_DIR: ${{ runner.temp }}/fluxfast-clean-live/artifacts
          FLUXFAST_E2E_PYTHON: python
          FLUXFAST_RUN_LIVE: "1"
        run: pnpm test:consumer:init

  clean-distributed-consumer:
    name: Clean distributed consumer
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.10.1-alpine3.23
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: npm install --global pnpm@10.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build release artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/fluxfast-clean-distributed/artifacts"
          python -m pip install build
          python -m build --outdir "$RUNNER_TEMP/fluxfast-clean-distributed/artifacts" python/fluxfast
          npm pack ./packages/core --pack-destination "$RUNNER_TEMP/fluxfast-clean-distributed/artifacts"
          npm pack ./packages/next --pack-destination "$RUNNER_TEMP/fluxfast-clean-distributed/artifacts"
      - name: Install Chromium
        run: pnpm --dir tests/browser/frontend exec playwright install --with-deps chromium
      - name: Verify three-worker Redis synchronization from packed artifacts
        env:
          FLUXFAST_ARTIFACT_DIR: ${{ runner.temp }}/fluxfast-clean-distributed/artifacts
          FLUXFAST_E2E_PYTHON: python
          FLUXFAST_RUN_DISTRIBUTED: "1"
          FLUXFAST_TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: pnpm test:consumer:init

  clean-production-consumer:
    name: Clean production consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: npm install --global pnpm@10.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build release artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/fluxfast-clean-production/artifacts"
          python -m pip install build
          python -m build --outdir "$RUNNER_TEMP/fluxfast-clean-production/artifacts" python/fluxfast
          npm pack ./packages/core --pack-destination "$RUNNER_TEMP/fluxfast-clean-production/artifacts"
          npm pack ./packages/next --pack-destination "$RUNNER_TEMP/fluxfast-clean-production/artifacts"
      - name: Install Chromium
        run: pnpm --dir tests/browser/frontend exec playwright install --with-deps chromium
      - name: Verify the packed one-service production lifecycle
        env:
          FLUXFAST_ARTIFACT_DIR: ${{ runner.temp }}/fluxfast-clean-production/artifacts
          FLUXFAST_E2E_PYTHON: python
          FLUXFAST_RUN_PRODUCTION: "1"
        run: pnpm test:consumer:init

  mixed-version-consumers:
    name: Current source packages with published v0.6
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.10.1-alpine3.23
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: npm install --global pnpm@10.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build current package artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/fluxfast-mixed/artifacts"
          python -m pip install build
          python -m build --outdir "$RUNNER_TEMP/fluxfast-mixed/artifacts" python/fluxfast
          npm pack ./packages/core --pack-destination "$RUNNER_TEMP/fluxfast-mixed/artifacts"
          npm pack ./packages/next --pack-destination "$RUNNER_TEMP/fluxfast-mixed/artifacts"
      - name: Install Chromium
        run: pnpm --dir tests/browser/frontend exec playwright install --with-deps chromium
      - name: Verify current Python with published 0.6.0 JavaScript
        env:
          FLUXFAST_E2E_PYTHON: python
          FLUXFAST_PAIRING: python-current
          FLUXFAST_PREVIOUS_VERSION: 0.6.0
          FLUXFAST_TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          release_version="$(node -p 'require("./package.json").version')"
          python_wheel="$(realpath "$RUNNER_TEMP"/fluxfast-mixed/artifacts/fluxfast-*.whl)"
          FLUXFAST_RELEASE_VERSION="$release_version" \
          FLUXFAST_PYTHON_SPEC="fluxfast[redis] @ file://$python_wheel" \
          FLUXFAST_CORE_SPEC="@fluxfast/core@0.6.0" \
          FLUXFAST_NEXT_SPEC="@fluxfast/next@0.6.0" \
            node scripts/test-published-mixed-consumer.mjs
      - name: Verify published Python 0.6.0 with current JavaScript
        env:
          FLUXFAST_E2E_PYTHON: python
          FLUXFAST_PAIRING: javascript-current
          FLUXFAST_PREVIOUS_VERSION: 0.6.0
        run: |
          release_version="$(node -p 'require("./package.json").version')"
          core_tarball="$(realpath "$RUNNER_TEMP"/fluxfast-mixed/artifacts/fluxfast-core-*.tgz)"
          next_tarball="$(realpath "$RUNNER_TEMP"/fluxfast-mixed/artifacts/fluxfast-next-*.tgz)"
          FLUXFAST_RELEASE_VERSION="$release_version" \
          FLUXFAST_PYTHON_SPEC="fluxfast==0.6.0" \
          FLUXFAST_CORE_SPEC="$core_tarball" \
          FLUXFAST_NEXT_SPEC="$next_tarball" \
            node scripts/test-published-mixed-consumer.mjs
