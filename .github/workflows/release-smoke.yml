name: Release artifacts

on:
  push:
  pull_request:

jobs:
  javascript-consumer:
    name: Next.js ${{ matrix.next-version }} on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 22
            next-version: 16.3.0
          - node-version: 24
            next-version: 16.3.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - run: npm install --global pnpm@10.15.0
      - name: Validate synchronized package versions
        run: |
          version="$(node -p 'require("./package.json").version')"
          node scripts/check-release-version.mjs "v${version}"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack npm artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/fluxfast-release/artifacts"
          npm pack ./packages/core --pack-destination "$RUNNER_TEMP/fluxfast-release/artifacts"
          npm pack ./packages/next --pack-destination "$RUNNER_TEMP/fluxfast-release/artifacts"
      - name: Install artifacts in an isolated consumer
        run: |
          mkdir -p "$RUNNER_TEMP/fluxfast-release/javascript"
          cp -R tests/release-consumer/javascript/. "$RUNNER_TEMP/fluxfast-release/javascript"
          npm pkg set \
            "dependencies.next=${{ matrix.next-version }}" \
            --prefix "$RUNNER_TEMP/fluxfast-release/javascript"
          npm install --prefix "$RUNNER_TEMP/fluxfast-release/javascript" --package-lock=false
          npm install --prefix "$RUNNER_TEMP/fluxfast-release/javascript" --package-lock=false --no-save \
            "$RUNNER_TEMP"/fluxfast-release/artifacts/fluxfast-core-*.tgz \
            "$RUNNER_TEMP"/fluxfast-release/artifacts/fluxfast-next-*.tgz
      - name: Verify npm artifacts
        working-directory: ${{ runner.temp }}/fluxfast-release/javascript
        run: |
          npm run generate
          npm run typecheck
          npm run smoke
      - name: Initialize and build a clean Next.js consumer
        env:
          FLUXFAST_ARTIFACT_DIR: ${{ runner.temp }}/fluxfast-release/artifacts
          FLUXFAST_NEXT_VERSION: ${{ matrix.next-version }}
        run: pnpm test:consumer:init

  python-consumer:
    name: Python wheel consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - name: Build Python artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/fluxfast-release/artifacts"
          python -m build --outdir "$RUNNER_TEMP/fluxfast-release/artifacts" python/fluxfast
      - name: Install wheel in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/fluxfast-release/venv"
          "$RUNNER_TEMP/fluxfast-release/venv/bin/python" -m pip install \
            "$RUNNER_TEMP"/fluxfast-release/artifacts/fluxfast-*.whl
      - name: Verify Python artifact
        run: |
          "$RUNNER_TEMP/fluxfast-release/venv/bin/python" tests/release-consumer/python/smoke.py
          "$RUNNER_TEMP/fluxfast-release/venv/bin/fluxfast" --help
