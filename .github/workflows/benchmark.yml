name: Benchmark

on:
  workflow_dispatch:
    inputs:
      compare_v090:
        description: Compare the v1.0 candidate with v0.9.0 in both workload orders
        type: boolean
        required: false
        default: false

jobs:
  controlled:
    if: ${{ !inputs.compare_v090 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@10.15.0
      - run: python -m pip install -e 'python/fluxfast[dev,redis]'
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p benchmark-results
      - run: PYTHONPATH=python/fluxfast/src:. python benchmarks/scripts/benchmark_cross_page.py | tee benchmark-results/cross-page.txt
      - run: PYTHONPATH=python/fluxfast/src:. python benchmarks/scripts/benchmark_deferred.py | tee benchmark-results/deferred.txt
      - run: PYTHONPATH=python/fluxfast/src:. python benchmarks/scripts/benchmark_live.py | tee benchmark-results/live.txt
      - name: Benchmark distributed resource cache
        run: >-
          PYTHONPATH=python/fluxfast/src:.
          python benchmarks/scripts/benchmark_redis_cache.py
          | tee benchmark-results/redis-cache.txt
        env:
          FLUXFAST_BENCHMARK_REDIS_URL: redis://127.0.0.1:6379/15
      - name: Benchmark schema code generation
        run: pnpm benchmark:codegen | tee benchmark-results/codegen.txt
      - name: Benchmark validator runtime
        run: pnpm benchmark:validation | tee benchmark-results/validation.txt
      - name: Benchmark client memory and resource lifecycle
        run: pnpm benchmark:memory | tee benchmark-results/memory.txt
      - name: Benchmark production bundle
        run: pnpm benchmark:bundle | tee benchmark-results/bundle.txt
      - name: Benchmark production lifecycle
        run: >-
          PYTHONPATH=python/fluxfast/src:.
          python benchmarks/scripts/benchmark_production.py
          | tee benchmark-results/production-lifecycle.txt
      - name: Benchmark production container
        run: >-
          PYTHONPATH=python/fluxfast/src:.
          python benchmarks/scripts/benchmark_container.py
          | tee benchmark-results/production-container.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: controlled-benchmark
          path: benchmark-results/

  compare-v090:
    name: v0.9/candidate comparison
    if: ${{ inputs.compare_v090 }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    services:
      redis:
        image: redis:8.10.1-alpine3.23
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v0.9.0
          path: .comparison-baseline
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@10.15.0
      - run: python -m pip install 'python/fluxfast[dev,redis]'
      - name: Align comparison tooling without changing baseline runtime sources
        run: |
          cp pnpm-lock.yaml .comparison-baseline/pnpm-lock.yaml
          cp packages/next/package.json .comparison-baseline/packages/next/package.json
          cp tests/browser/frontend/package.json .comparison-baseline/tests/browser/frontend/package.json
          pnpm install --frozen-lockfile
          pnpm --dir .comparison-baseline install --frozen-lockfile
      - name: Compare baseline then candidate
        env:
          FLUXFAST_BENCHMARK_REDIS_URL: redis://127.0.0.1:6379/15
        run: >-
          node benchmarks/scripts/benchmark_v1_comparison.mjs
          --baseline .comparison-baseline
          --output "$RUNNER_TEMP/comparison-forward"
      - name: Compare candidate then baseline
        env:
          FLUXFAST_BENCHMARK_REDIS_URL: redis://127.0.0.1:6379/15
        run: >-
          node benchmarks/scripts/benchmark_v1_comparison.mjs
          --baseline .comparison-baseline
          --output "$RUNNER_TEMP/comparison-reverse"
          --reverse
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: v090-candidate-comparison
          path: |
            ${{ runner.temp }}/comparison-forward/
            ${{ runner.temp }}/comparison-reverse/
          if-no-files-found: error
