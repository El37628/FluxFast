name: Container

on:
  push:
  pull_request:

jobs:
  docker:
    name: Docker production image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@10.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir tests/browser/frontend exec playwright install --with-deps chromium
      - run: pnpm test:container:docker

  podman:
    name: Rootless Podman production image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: sudo apt-get update && sudo apt-get install --yes podman
      - run: npm install --global pnpm@10.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir tests/browser/frontend exec playwright install --with-deps chromium
      - run: pnpm test:container:podman

  compose-docker:
    name: Docker Compose with Redis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@10.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir tests/browser/frontend exec playwright install --with-deps chromium
      - run: pnpm test:compose:docker

  compose-podman:
    name: Rootless Podman Compose with Redis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: sudo apt-get update && sudo apt-get install --yes podman
      - run: npm install --global pnpm@10.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir tests/browser/frontend exec playwright install --with-deps chromium
      - run: pnpm test:compose:podman
